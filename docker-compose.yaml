
services:
  backend:
    build: .
    container_name: waitless-backend
    ports:
      - 8000:8000
    environment:
      MONGO_URI: "mongodb://${MONGO_ADMIN}:${MONGO_PASS}@mongo:27017/?authSource=admin"
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      ALLOWED_ORIGIN1: ${ALLOWED_ORIGIN1}
      ALLOWED_ORIGIN2: ${ALLOWED_ORIGIN2}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

    networks:
      - waitlessnet
    depends_on:
      - mongo

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}

    networks:
      - waitlessnet

    volumes:
      - mongo-data:/data/db
    
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
      - 8081:8081
    
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: qwerty
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_ADMIN}:${MONGO_PASS}@mongo:27017/?authSource=admin"
    
    networks:
      - waitlessnet

    depends_on:
      - mongo 

volumes:
  mongo-data:

networks:
  waitlessnet:
    driver: bridge